<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PhishyGuard — Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg);
    }
    .login-card {
      width: 380px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 36px 32px;
    }
    .login-logo {
      text-align: center; margin-bottom: 28px;
    }
    .login-logo .brand-icon { font-size: 36px; display: block; margin-bottom: 8px; }
    .login-logo .brand-name { font-size: 20px; font-weight: 700; }
    .login-logo .brand-sub  { font-size: 13px; color: var(--text2); margin-top: 4px; }

    .form-group { margin-bottom: 18px; }
    .form-label {
      display: block; font-size: 13px; font-weight: 500;
      color: var(--text2); margin-bottom: 6px;
    }
    .form-input {
      width: 100%; padding: 10px 14px;
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text);
      font-size: 14px; outline: none;
      transition: border-color .15s;
    }
    .form-input:focus { border-color: var(--blue); }

    .btn-login {
      width: 100%; padding: 11px;
      background: var(--blue); color: #fff;
      border: none; border-radius: 6px;
      font-size: 15px; font-weight: 600;
      cursor: pointer; transition: background .15s;
      margin-top: 8px;
    }
    .btn-login:hover { background: #2563eb; }

    .login-error {
      background: var(--red-bg);
      border: 1px solid rgba(239,68,68,.3);
      color: var(--red);
      padding: 10px 14px; border-radius: 6px;
      font-size: 13px; margin-bottom: 18px;
    }
    .login-footer {
      text-align: center; margin-top: 20px;
      font-size: 12px; color: var(--text3);
    }
    .default-creds {
      margin-top: 16px;
      background: var(--amber-bg);
      border: 1px solid rgba(245,158,11,.3);
      border-radius: 6px; padding: 10px 14px;
      font-size: 12px; color: var(--amber);
    }
    .default-creds code {
      background: rgba(245,158,11,.15);
      padding: 1px 5px; border-radius: 3px;
    }
  </style>
</head>
<body>
<div class="login-wrapper">
  <div class="login-card">
    <div class="login-logo">
      <span class="brand-icon">⚡</span>
      <span class="brand-name">PhishyGuard</span>
      <div class="brand-sub">ML-Powered Phishing Detection</div>
    </div>

    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('auth_login') }}">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input class="form-input" type="text" id="username" name="username"
               placeholder="Enter username" autocomplete="username"
               autofocus required/>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" type="password" id="password" name="password"
               placeholder="Enter password" autocomplete="current-password" required/>
      </div>
      <button type="submit" class="btn-login">Sign In</button>
    </form>

    <div class="login-footer">
      <a href="{{ url_for('auth_register') }}">Register</a> · <a href="{{ url_for('forgot_password') }}">Forgot password</a><br/>
      PhishyGuard · SOC Phishing Detection Platform
    </div>
  </div>
</div>
</body>
</html>
