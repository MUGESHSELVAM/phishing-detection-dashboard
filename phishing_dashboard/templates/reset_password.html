<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PhishyGuard — Reset Password</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body>
<div class="login-wrapper">
  <div class="login-card">
    <div class="login-logo">
      <span class="brand-icon">🔄</span>
      <span class="brand-name">PhishyGuard</span>
      <div class="brand-sub">Set a new account password</div>
    </div>
    {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
    {% if success %}<div class="login-success">{{ success }}</div>{% endif %}
    <form method="POST" action="{{ url_for('reset_password', token=request.view_args.get('token')) }}">
      <div class="form-group"><label class="form-label">Email</label>
        <input class="form-input" value="{{ email }}" disabled/></div>
      <div class="form-group"><label class="form-label">New password</label>
        <input class="form-input" type="password" name="password" required/></div>
      <div class="form-group"><label class="form-label">Confirm new password</label>
        <input class="form-input" type="password" name="confirm" required/></div>
      <button type="submit" class="btn-login">Update password</button>
    </form>
  </div>
</div>
</body>
</html>
